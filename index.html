    <script type="text/javascript">
      // GitHub Pages SPA redirect: parses ?p=/path from 404.html handoff and
      // restores the intended URL before React Router boots.
      (function (location) {
        if (location.search) {
          var q = {};
          location.search
            .slice(1)
            .split("&")
            .forEach(function (v) {
              var a = v.split("=");
              q[a[0]] = a.slice(1).join("=").replace(/~and~/g, "&");
            });
          if (q.p !== undefined) {
            window.history.replaceState(
              null,
              null,
              location.pathname.slice(0, -1) +
                (q.p || "") +
                (q.q ? "?" + q.q : "") +
                location.hash
            );
          }
        }
      })(window.location);
    </script>
